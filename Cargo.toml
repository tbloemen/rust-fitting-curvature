[workspace]
members = ["crates/core", "crates/web", "crates/optimizer", "crates/analysis"]
resolver = "2"

[profile.release]
lto = true
# Single codegen unit lets LTO fully inline/vectorise the O(n²) distance and
# gradient inner loops (the hot path for the 5000-sample sweeps). Costs a slower
# one-time compile; the SLURM build is cached so jobs pay it at most once.
codegen-units = 1

# Pedantic clippy is enabled workspace-wide (see `[lints] workspace = true` in
# each crate). The ratchet of temporary allow-list entries has been cleared:
# every clippy::pedantic lint that fired anywhere has been fixed.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
